name: Build Image

on:
  workflow_dispatch:
    inputs:
      image:
        description: "Image to build (a directory under images/)"
        required: true
        type: choice
        options:
          - caddy
      version:
        description: "Version to build (concrete tag, e.g. 1.0.0). Leave empty to use image.yml."
        required: false
        type: string
  # A push that touches this workflow file itself re-registers the workflow
  # with GitHub (the job is skipped unless manually dispatched). See README.
  push:
    paths:
      - .github/workflows/build.yml

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' # skip on push (registration only)
    name: Build ${{ inputs.image }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate image directory
        env:
          IMAGE: ${{ inputs.image }}
        run: ./scripts/build-meta.sh validate

      - name: Resolve version
        id: vars
        env:
          IMAGE: ${{ inputs.image }}
          VERSION_INPUT: ${{ inputs.version }}
        run: ./scripts/build-meta.sh resolve

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ inputs.image }}
          tags: |
            type=raw,value=${{ steps.vars.outputs.version }}
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: images/${{ inputs.image }}
          file: images/${{ inputs.image }}/Dockerfile
          platforms: ${{ steps.vars.outputs.platforms }}
          build-args: |
            VERSION=${{ steps.vars.outputs.version }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
