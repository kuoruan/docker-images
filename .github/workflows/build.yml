name: Build Image

on:
  workflow_dispatch:
    inputs:
      image:
        description: "Image to build (a directory under images/)"
        required: true
        type: choice
        options:
          - caddy
      version:
        description: "Version to build: a semver tag (e.g. 2.11.4) or a full 40-char commit hash. Leave empty to use image.yml."
        required: false
        type: string
  # An image tag of the form <image>/v<version> (created by Update Versions)
  # triggers a build of that image at that version.
  push:
    tags:
      - '*/v*'

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build ${{ inputs.image || github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: ./.github/actions/setup-python

      - name: Resolve and validate image
        id: vars
        env:
          INPUT_IMAGE: ${{ inputs.image }}
          INPUT_VERSION: ${{ inputs.version }}
        run: python3 scripts/build-meta.py

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ steps.vars.outputs.image }}
          # `tag` is the semver for releases, or a 7-char short hash for
          # commit builds; `latest` always points at the most recent build.
          tags: |
            type=raw,value=${{ steps.vars.outputs.tag }}
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: images/${{ steps.vars.outputs.image }}
          file: images/${{ steps.vars.outputs.image }}/Dockerfile
          platforms: ${{ steps.vars.outputs.platforms }}
          build-args: |
            VERSION=${{ steps.vars.outputs.version }}
            BASE_VERSION=${{ steps.vars.outputs.base_version }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
