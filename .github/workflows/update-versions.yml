name: Update Versions

# Bumps each image.yml's `version` to the latest upstream release (PyYAML
# round-trip), when the image declares an `update` source. An image may ship an
# `update-check.sh` hook that vetoes versions it cannot build; a rejected bump
# keeps the current pin. After committing, each bumped image is tagged as
# <image>/v<version> and a Build Image run is dispatched for it. The dispatch is
# what builds: the tag alone starts nothing, since GitHub creates no workflow
# run for a push made with the default GITHUB_TOKEN.

on:
  schedule:
    - cron: '37 4 * * 1' # every Monday 04:37 UTC
  workflow_dispatch:

permissions:
  contents: write
  # Needed by scripts/dispatch-builds.py to start Build Image runs.
  actions: write

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  update:
    if: github.repository_owner == 'kuoruan' # only run on the upstream owner's repos, not forks
    name: Bump Versions
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.bump.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: ./.github/actions/setup-python

      - name: Bump versions
        id: bump
        run: python3 scripts/update-versions.py

      - name: Commit changed versions
        id: commit
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: bump image versions to latest upstream"
          file_pattern: images/

      # Tag each bumped image as <image>/v<version>, for the record; the tag
      # itself does not start a build (see the dispatch step below).
      - name: Tag bumped images
        if: steps.commit.outputs.changes_detected == 'true'
        run: python3 scripts/tag-bumped.py

      - name: Dispatch builds
        if: steps.commit.outputs.changes_detected == 'true'
        run: python3 scripts/dispatch-builds.py

