name: Update Versions

# Bumps each image.yml's `version` to the latest upstream release (PyYAML
# round-trip), when the image declares an `update` source. After committing,
# each bumped image is tagged as <image>/v<version> and pushed; that tag
# triggers the Build Image workflow (its push.tags trigger).

on:
  schedule:
    - cron: '37 4 * * 1' # every Monday 04:37 UTC
  workflow_dispatch:

permissions:
  contents: write

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  update:
    if: github.repository_owner == 'kuoruan' # only run on the upstream owner's repos, not forks
    name: Bump Versions
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.bump.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: ./.github/actions/setup-python

      - name: Bump versions
        id: bump
        run: python3 scripts/update-versions.py

      - name: Commit changed versions
        id: commit
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: bump image versions to latest upstream"
          file_pattern: images/

      # Tag each bumped image as <image>/v<version>; pushing the tag triggers
      # the Build Image workflow via its push.tags trigger.
      - name: Tag bumped images
        if: steps.commit.outputs.changes_detected == 'true'
        run: python3 scripts/tag-bumped.py

