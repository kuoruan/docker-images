# Per-image metadata consumed by .github/workflows/build.yml.
# Edit this file and re-run the "Build Docker Image" workflow to rebuild.
# version is the default version and must be a semver tag (e.g. 2.11.4): it is
# what Update Versions bumps weekly, and the base-image fallback when a
# commit-hash build is requested. To build an unreleased fix, leave this file
# alone and pass the full 40-char commit hash via the workflow's version
# input instead; that build is tagged with the 7-char short hash.

name: caddy
version: "2.11.4"
description: Custom Caddy image built via xcaddy.
platforms:
  - linux/amd64
  - linux/arm64

update:
  github: caddyserver/caddy   # latest release tag is fetched from this repo
  tag_prefix: v               # strip this prefix from the tag to get the version
